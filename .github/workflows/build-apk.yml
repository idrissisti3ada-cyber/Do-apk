name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable could not be detected on PATH."
            exit 1
          fi
          java -version
          VERSION_STRING="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$VERSION_STRING" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi
          MAJOR_VERSION="$(echo "$VERSION_STRING" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from: $VERSION_STRING"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          set -euo pipefail
          if [ -s "./debug.keystore.base64" ] && [ ! -f "./debug.keystore" ]; then
            base64 -d ./debug.keystore.base64 > ./debug.keystore
            echo "Decoded ./debug.keystore from ./debug.keystore.base64."
          fi
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
              echo "::error::keytool not found in configured Java installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::debug.keystore could not be created."
            exit 1
          fi
          echo "debug.keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have .apk extension."
            exit 1
          fi
          echo "Verified APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TMP_DIR"
          DEST_APK="${TMP_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Prepared release asset is missing or empty."
            exit 1
          fi
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared APK does not exist or is empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset does not end in .apk."
            exit 1
          fi
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES=$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Intended for testing only (not a Play Store production release).
          - Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$NOTES" \
            --latest

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            gh release view "$TAG"
            RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Release Title:** Debug APK Build #${GITHUB_RUN_NUMBER}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ "${{ steps.verify_apk.outcome }}" = "success" ] && [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
              {
                echo "### GitHub Release Publishing Failed"
                echo ""
                echo "The debug APK build succeeded, and the backup GitHub Actions artifact \`app-debug-apk\` remains available."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The APK build or artifact upload did not complete successfully."
              {
                echo "### APK Build Status"
                echo ""
                echo "GitHub Release publishing failed and the APK build or artifact upload did not complete."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
